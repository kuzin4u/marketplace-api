<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина и оформление заказа</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg:#f8fafc;--card:#fff;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --ac:#1e40af;--ac-l:#dbeafe;--grn:#16a34a;--grn-l:#dcfce7;
  --orn:#d97706;--orn-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;
  --brd:#e2e8f0;--sans:'Inter',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:13px}

.page{max-width:880px;margin:0 auto;padding:24px 20px 60px}
.page-hdr{margin-bottom:20px}
.page-hdr h1{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.page-hdr p{font-size:13px;color:var(--tx2)}

/* Layout: cart left, summary right */
.checkout-grid{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}

/* Cart card */
.c-card{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:20px;margin-bottom:14px}
.c-card h3{font-size:15px;font-weight:700;margin-bottom:12px}

/* Cart item */
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--brd);align-items:center}
.cart-item:last-child{border-bottom:none}
.ci-img{width:64px;height:64px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
.ci-body{flex:1;min-width:0}
.ci-title{font-size:14px;font-weight:600;margin-bottom:2px}
.ci-seller{font-size:11px;color:var(--tx3);margin-bottom:4px}
.ci-seller a{color:var(--ac);text-decoration:none}
.ci-price{font-size:12px;color:var(--tx2)}
.ci-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ci-qty{display:flex;align-items:center;gap:0;border:1px solid var(--brd);border-radius:8px;overflow:hidden}
.ci-qty button{width:32px;height:32px;border:none;background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.ci-qty button:hover{background:var(--brd)}
.ci-qty span{width:32px;text-align:center;font-size:13px;font-weight:600}
.ci-total{font-size:15px;font-weight:700;width:75px;text-align:right}
.ci-remove{width:28px;height:28px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--tx3)}
.ci-remove:hover{background:var(--red-l);color:var(--red)}

/* Source type indicator */
.source-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:11px;margin-bottom:12px}
.source-bar.mig{background:var(--grn-l);color:#166534}
.source-bar.net{background:var(--ac-l);color:var(--ac)}
.source-bar b{font-weight:700}

/* Empty cart */
.cart-empty{text-align:center;padding:40px 20px;color:var(--tx3)}
.cart-empty .icon{font-size:48px;margin-bottom:12px}
.cart-empty p{font-size:14px}

/* Shipping form */
.f{margin-bottom:14px}
.f label{display:block;font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--brd);border-radius:9px;font:400 13px/1.4 var(--sans);background:var(--bg);outline:none;transition:.2s}
.f input:focus,.f select:focus{border-color:var(--ac);background:var(--card)}
.f .hint{font-size:10px;color:var(--tx3);margin-top:3px}
.f-row{display:flex;gap:10px}
.f-row .f{flex:1}

/* Payment options */
.pay-opts{display:flex;flex-direction:column;gap:6px}
.pay-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--brd);border-radius:9px;cursor:pointer;transition:.15s}
.pay-opt:hover{border-color:var(--ac)}
.pay-opt.on{border-color:var(--ac);background:var(--ac-l)}
.pay-opt .po-icon{font-size:18px}
.pay-opt .po-name{font-size:13px;font-weight:500}
.pay-opt .po-desc{font-size:10px;color:var(--tx3)}

/* Summary card (sticky) */
.summary{position:sticky;top:20px}
.s-card{background:var(--card);border:1.5px solid var(--brd);border-radius:14px;padding:20px}
.s-card h3{font-size:15px;font-weight:700;margin-bottom:14px}
.s-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--tx2)}
.s-row.total{border-top:1.5px solid var(--brd);margin-top:8px;padding-top:10px;font-size:16px;font-weight:700;color:var(--tx)}
.s-delivery{font-size:11px;color:var(--tx3);margin-top:2px}

.btn-order{width:100%;padding:14px;border-radius:10px;border:none;background:var(--ac);color:#fff;font:700 15px/1 var(--sans);cursor:pointer;margin-top:16px;transition:.15s}
.btn-order:hover{background:#1d4ed8}
.btn-order:disabled{opacity:.5;cursor:not-allowed}

.s-trust{margin-top:12px;font-size:11px;color:var(--tx3);line-height:1.5;text-align:center}

/* Clearing preview */
.clearing-preview{margin-top:14px;padding:12px;background:var(--bg);border-radius:8px}
.clearing-preview h4{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;margin-bottom:6px}
.cp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);padding:2px 0}
.cp-row.seller{color:var(--grn);font-weight:600}

/* Success */
.success-card{background:var(--card);border:2px solid var(--grn);border-radius:14px;padding:32px;text-align:center}
.success-card .big{font-size:56px;margin-bottom:16px}
.success-card h2{font-size:20px;font-weight:800;margin-bottom:6px}
.success-card p{font-size:13px;color:var(--tx2);margin-bottom:20px;line-height:1.6}
.success-details{text-align:left;background:var(--bg);border-radius:10px;padding:14px;font-size:12px;color:var(--tx2);line-height:1.7}

.btn{padding:10px 18px;border-radius:8px;border:none;font:600 13px/1 var(--sans);cursor:pointer;transition:.15s}
.btn-s{background:var(--bg);color:var(--tx2);border:1px solid var(--brd)}

@media(max-width:720px){.checkout-grid{grid-template-columns:1fr}.summary{position:static}}
</style>
<style>
.demo-flag{position:sticky;top:0;z-index:9999;background:#9A6A12;color:#fff;
  padding:9px 16px;font-size:13px;line-height:1.45;text-align:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.demo-flag b{font-weight:700}
.demo-flag a{color:#fff;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-flag"><b>Демонстрация.</b> Заказ не создаётся: страница показывает ход оформления, но запрос в систему не отправляется. Номер заказа на последнем экране — вымышленный, остатки не списываются, продавец уведомления не получает.</div>

<div class="page">
  <div class="page-hdr">
    <h1 id="page-title">Корзина</h1>
    <p id="page-sub">Масса Матере · Оформление заказа</p>
  </div>
  <div id="app"></div>
</div>

<script>
// ============ STATE ============
var cart = [
  { sku_id:'SKU-001', title:'Тартин на закваске', price:450, qty:2, stock:12, emoji:'🍞',
    seller_id:'PTR-12345', seller_name:'Масса Матере', seller_slug:'massamadre', shop_id:'SHOP-massamadre' },
  { sku_id:'SKU-003', title:'Тартин сырный', price:520, qty:1, stock:6, emoji:'🧀',
    seller_id:'PTR-12345', seller_name:'Масса Матере', seller_slug:'massamadre', shop_id:'SHOP-massamadre' }
];

var context = {
  entry_point: 'SHOP',       // SHOP or CATALOG
  source_type: 'MIGRATED',   // determined by entry_point
  shop_slug: 'massamadre'
};

var checkout = {
  step: 'cart',  // cart | shipping | payment | success
  name: '',
  phone: '',
  address: '',
  payment: 'sbp',
  order_id: null
};

// Tariffs (from registry, loaded via API in production)
var API = 'https://marketplace-api-ujfh.onrender.com/api/v1';
var TARIFFS = {
  fulfillment: { rate: 200, unit: 'PER_ITEM', name: '3PL-Сервис' },
  logistics:   { rate: 350, unit: 'PER_ORDER', name: 'Курьер-Экспресс', zone: 'Москва' },
  organizer:   { rate: 0.2, unit: 'PERCENT', name: 'Организатор' }
};

// ============ CALCULATIONS ============
function totalGoods() { return cart.reduce(function(s,i){return s + i.price * i.qty;}, 0); }
function totalQty() { return cart.reduce(function(s,i){return s + i.qty;}, 0); }
function deliveryCost() { return cart.length > 0 ? TARIFFS.logistics.rate : 0; }
function fulfillmentCost() { return totalQty() * TARIFFS.fulfillment.rate; }
function organizerFee() { return Math.round(totalGoods() * TARIFFS.organizer.rate / 100 * 100) / 100; }
function sellerReceives() { return totalGoods() - fulfillmentCost() - organizerFee(); }
function totalForBuyer() { return totalGoods() + deliveryCost(); }

// ============ RENDER ============
function render() {
  var el = document.getElementById('app');
  if (checkout.step === 'success') { renderSuccess(el); return; }

  var h = '<div class="checkout-grid">';

  // ===== LEFT: Cart + Shipping =====
  h += '<div>';

  // Source type bar
  if (context.source_type === 'MIGRATED') {
    h += '<div class="source-bar mig"><b>Магазин:</b> '+cart[0].seller_name+' · entry_point: SHOP · source_type: MIGRATED</div>';
  } else {
    h += '<div class="source-bar net"><b>Каталог Системы</b> · entry_point: CATALOG · source_type: NETWORK</div>';
  }

  // Cart items
  h += '<div class="c-card"><h3>Товары ('+totalQty()+')</h3>';
  if (cart.length === 0) {
    h += '<div class="cart-empty"><div class="icon">🛒</div><p>Корзина пуста</p></div>';
  } else {
    cart.forEach(function(item, idx) {
      h += '<div class="cart-item">';
      h += '<div class="ci-img">'+item.emoji+'</div>';
      h += '<div class="ci-body">';
      h += '<div class="ci-title">'+esc(item.title)+'</div>';
      h += '<div class="ci-seller"><a href="/s/'+item.seller_slug+'">🏪 '+item.seller_name+'</a></div>';
      h += '<div class="ci-price">'+item.price+' ₽ / шт</div>';
      h += '</div>';
      h += '<div class="ci-controls">';
      h += '<div class="ci-qty">';
      h += '<button onclick="changeQty('+idx+',-1)">−</button>';
      h += '<span>'+item.qty+'</span>';
      h += '<button onclick="changeQty('+idx+',1)">+</button>';
      h += '</div>';
      h += '<div class="ci-total">'+(item.price * item.qty)+' ₽</div>';
      h += '<button class="ci-remove" onclick="removeItem('+idx+')">✕</button>';
      h += '</div></div>';
    });
  }
  h += '</div>';

  // Shipping (step 2)
  if (checkout.step === 'shipping' || checkout.step === 'payment') {
    h += '<div class="c-card"><h3>Доставка</h3>';
    h += '<div class="f-row">';
    h += '<div class="f"><label>Имя</label><input id="f-name" value="'+esc(checkout.name)+'" placeholder="Анна" /></div>';
    h += '<div class="f"><label>Телефон</label><input id="f-phone" value="'+esc(checkout.phone)+'" placeholder="+7 900 123-45-67" /></div>';
    h += '</div>';
    h += '<div class="f"><label>Адрес доставки</label><input id="f-addr" value="'+esc(checkout.address)+'" placeholder="Москва, ул. Пекарная, д. 15, кв. 42" /></div>';
    h += '<div class="f"><label>Способ доставки</label>';
    h += '<div style="padding:8px 12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--tx2)">';
    h += '🚚 <b>'+TARIFFS.logistics.name+'</b> · '+TARIFFS.logistics.zone+' · '+TARIFFS.logistics.rate+' ₽ · SLA 24ч';
    h += '</div></div>';
    h += '</div>';
  }

  // Payment (step 3)
  if (checkout.step === 'payment') {
    h += '<div class="c-card"><h3>Оплата</h3>';
    h += '<div class="pay-opts">';
    [
      {id:'sbp', icon:'📱', name:'СБП', desc:'Моментальный перевод'},
      {id:'card', icon:'💳', name:'Картой онлайн', desc:'Visa / MasterCard / МИР'},
      {id:'cash', icon:'💵', name:'Наличными', desc:'При получении'},
      {id:'card_delivery', icon:'💳', name:'Картой при получении', desc:'Терминал у курьера'}
    ].forEach(function(p){
      h += '<div class="pay-opt'+(checkout.payment===p.id?' on':'')+'" onclick="checkout.payment=\''+p.id+'\';render()">';
      h += '<span class="po-icon">'+p.icon+'</span>';
      h += '<div><div class="po-name">'+p.name+'</div><div class="po-desc">'+p.desc+'</div></div>';
      h += '</div>';
    });
    h += '</div></div>';
  }

  h += '</div>';

  // ===== RIGHT: Summary =====
  h += '<div class="summary"><div class="s-card">';
  h += '<h3>Итого</h3>';
  h += '<div class="s-row"><span>Товары ('+totalQty()+' шт)</span><span>'+totalGoods().toLocaleString('ru')+' ₽</span></div>';
  h += '<div class="s-row"><span>Доставка</span><span>'+deliveryCost()+' ₽</span></div>';
  h += '<div class="s-delivery">'+TARIFFS.logistics.name+' · '+TARIFFS.logistics.zone+'</div>';
  h += '<div class="s-row total"><span>К оплате</span><span>'+totalForBuyer().toLocaleString('ru')+' ₽</span></div>';

  // Clearing preview (transparent — seller sees where money goes)
  h += '<div class="clearing-preview">';
  h += '<h4>Распределение (ст. 6.7)</h4>';
  h += '<div class="cp-row seller"><span>Селлеру ('+cart[0].seller_name+')</span><span>'+sellerReceives().toLocaleString('ru')+' ₽</span></div>';
  h += '<div class="cp-row"><span>Фулфилмент ('+TARIFFS.fulfillment.name+')</span><span>'+fulfillmentCost()+' ₽</span></div>';
  h += '<div class="cp-row"><span>Доставка ('+TARIFFS.logistics.name+')</span><span>'+deliveryCost()+' ₽</span></div>';
  h += '<div class="cp-row"><span>Организатор ('+TARIFFS.organizer.rate+'%)</span><span>'+organizerFee()+' ₽</span></div>';
  h += '</div>';

  // Action button
  if (cart.length > 0) {
    if (checkout.step === 'cart') {
      h += '<button class="btn-order" onclick="goShipping()">Оформить заказ →</button>';
    } else if (checkout.step === 'shipping') {
      h += '<button class="btn-order" onclick="goPayment()">Перейти к оплате →</button>';
    } else if (checkout.step === 'payment') {
      h += '<button class="btn-order" onclick="placeOrder()">Оплатить '+totalForBuyer().toLocaleString('ru')+' ₽</button>';
    }
  }

  h += '<div class="s-trust">🔒 Средства защищены эскроу до подтверждения получения</div>';

  h += '</div></div>';
  h += '</div>';

  el.innerHTML = h;
}

// ============ CART ACTIONS ============
function changeQty(idx, delta) {
  var item = cart[idx];
  var newQty = item.qty + delta;
  if (newQty < 1) return;
  if (newQty > item.stock) { alert('Доступно: '+item.stock+' шт'); return; }
  item.qty = newQty;

  // In production: PATCH /api/v1/cart/item/{id} — atomic stock re-reservation
  console.log('Cart update:', item.sku_id, 'qty:', newQty);
  render();
}

function removeItem(idx) {
  var item = cart[idx];
  // In production: DELETE /api/v1/cart/item/{id} — releases stock_reserved
  console.log('Cart remove:', item.sku_id);
  cart.splice(idx, 1);
  if (cart.length === 0) checkout.step = 'cart';
  render();
}

// ============ CHECKOUT STEPS ============
function goShipping() {
  checkout.step = 'shipping';
  document.getElementById('page-title').textContent = 'Оформление заказа';
  render();
  setTimeout(function(){ document.getElementById('f-name').focus(); }, 100);
}

function goPayment() {
  checkout.name = document.getElementById('f-name').value;
  checkout.phone = document.getElementById('f-phone').value;
  checkout.address = document.getElementById('f-addr').value;
  if (!checkout.name || !checkout.phone) { alert('Заполните имя и телефон'); return; }
  checkout.step = 'payment';
  render();
}

function placeOrder() {
  // In production: POST /api/v1/orders
  var payload = {
    customer: { name: checkout.name, phone: checkout.phone },
    items: cart.map(function(i){ return { sku_id: i.sku_id, qty: i.qty }; }),
    entry_point: context.entry_point,
    shipping_address: checkout.address,
    payment_method: checkout.payment
  };
  console.log('ORDER PAYLOAD:', JSON.stringify(payload, null, 2));

  checkout.order_id = 'ORD-' + Math.random().toString(36).substr(2,5).toUpperCase();
  checkout.step = 'success';
  render();
}

// ============ SUCCESS ============
function renderSuccess(el) {
  el.innerHTML = '<div class="success-card">' +
    '<div class="big">✅</div>' +
    '<h2>Заказ '+checkout.order_id+' оформлен!</h2>' +
    '<p>Ожидайте подтверждения от '+cart[0].seller_name+'.<br>Средства защищены эскроу до получения товара.</p>' +
    '<div class="success-details">' +
      '<div><b>Покупатель:</b> '+esc(checkout.name)+', '+esc(checkout.phone)+'</div>' +
      '<div><b>Адрес:</b> '+esc(checkout.address)+'</div>' +
      '<div><b>Оплата:</b> '+{sbp:'СБП',card:'Картой онлайн',cash:'Наличными',card_delivery:'Картой при получении'}[checkout.payment]+'</div>' +
      '<div><b>Сумма:</b> '+totalForBuyer().toLocaleString('ru')+' ₽</div>' +
      '<div><b>Источник:</b> '+context.entry_point+' → '+context.source_type+'</div>' +
      '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--brd)">' +
        '<div><b>Клиринг (ст. 6.7):</b></div>' +
        '<div>Селлеру: '+sellerReceives().toLocaleString('ru')+' ₽</div>' +
        '<div>Фулфилменту: '+fulfillmentCost()+' ₽</div>' +
        '<div>Логистике: '+deliveryCost()+' ₽</div>' +
        '<div>Организатору: '+organizerFee()+' ₽</div>' +
      '</div>' +
    '</div>' +
    '<div style="margin-top:20px;display:flex;gap:10px;justify-content:center">' +
      '<button class="btn btn-s" onclick="location.reload()">← Новый заказ</button>' +
      '<button class="btn btn-s" onclick="alert(\'→ /api/v1/orders/'+checkout.order_id+'\')">Статус заказа</button>' +
    '</div>' +
  '</div>';
}

// ============ UTILS ============
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ============ CONTEXT SWITCH ============
// Переключение контекста: магазин ↔ каталог
function setContext(ep) {
  context.entry_point = ep;
  context.source_type = (ep === 'CATALOG') ? 'NETWORK' : 'MIGRATED';
  render();
}

// ============ INIT ============
render();
</script>
</body>
</html>
