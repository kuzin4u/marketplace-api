<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Создание магазина</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #f8fafc; --card: #ffffff; --tx: #0f172a; --tx2: #475569; --tx3: #94a3b8;
  --ac: #1e40af; --ac-l: #dbeafe; --ac-bg: #eff6ff;
  --grn: #16a34a; --grn-l: #dcfce7;
  --orn: #d97706; --orn-l: #fef3c7;
  --red: #dc2626; --red-l: #fee2e2;
  --brd: #e2e8f0; --radius: 14px;
  --sans: 'Inter', -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--tx); min-height: 100vh; }

.page { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }

/* Header */
.page-hdr { text-align: center; margin-bottom: 32px; }
.page-hdr h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 6px; }
.page-hdr p { font-size: 14px; color: var(--tx2); }

/* Steps indicator */
.steps { display: flex; gap: 4px; margin-bottom: 28px; }
.step-dot { flex: 1; height: 4px; border-radius: 2px; background: var(--brd); transition: .3s; }
.step-dot.done { background: var(--grn); }
.step-dot.active { background: var(--ac); }

/* Form card */
.form-card { background: var(--card); border: 1.5px solid var(--brd); border-radius: var(--radius); padding: 28px; margin-bottom: 16px; }
.form-card h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
.form-card .sub { font-size: 13px; color: var(--tx2); margin-bottom: 20px; }

/* Fields */
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--tx2); text-transform: uppercase; letter-spacing: .3px; margin-bottom: 6px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--brd); border-radius: 10px;
  font: 400 14px/1.4 var(--sans); background: var(--bg); outline: none; transition: .2s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ac); background: var(--card); }
.field textarea { resize: vertical; min-height: 80px; }
.field .hint { font-size: 11px; color: var(--tx3); margin-top: 4px; }
.field .auto-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 3px; background: var(--ac-l); color: var(--ac); margin-left: 6px; }
.field .error { font-size: 11px; color: var(--red); margin-top: 4px; display: none; }

/* URL preview */
.url-preview { font-family: 'SF Mono', monospace; font-size: 13px; color: var(--tx2); padding: 8px 12px; background: var(--bg); border-radius: 8px; margin-top: 6px; }
.url-preview b { color: var(--ac); }

/* Color picker */
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.color-opt { width: 36px; height: 36px; border-radius: 10px; cursor: pointer; border: 3px solid transparent; transition: .15s; }
.color-opt.on { border-color: var(--tx); transform: scale(1.15); }

/* Logo preview */
.logo-preview { width: 64px; height: 64px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: #fff; margin-top: 8px; }

/* Channels */
.channels { display: flex; flex-direction: column; gap: 8px; }
.ch-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1.5px solid var(--brd); border-radius: 10px; }
.ch-row .ch-icon { font-size: 20px; flex-shrink: 0; }
.ch-row .ch-info { flex: 1; }
.ch-row .ch-name { font-size: 13px; font-weight: 600; }
.ch-row .ch-desc { font-size: 11px; color: var(--tx3); }
.ch-row .ch-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.ch-row.auto { border-color: var(--grn); }
.ch-row.auto .ch-badge { background: var(--grn-l); color: var(--grn); }
.ch-row.later .ch-badge { background: var(--orn-l); color: var(--orn); }

/* Preview card */
.preview-shop { border: 2px solid var(--ac); border-radius: var(--radius); overflow: hidden; margin-top: 12px; }
.preview-cover { height: 80px; }
.preview-body { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.preview-avatar { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; margin-top: -28px; border: 3px solid var(--card); flex-shrink: 0; }
.preview-text h3 { font-size: 15px; font-weight: 700; }
.preview-text p { font-size: 11px; color: var(--tx2); }

/* Buttons */
.btns { display: flex; gap: 10px; margin-top: 24px; }
.btn { flex: 1; padding: 13px; border-radius: 10px; border: none; font: 600 14px/1 var(--sans); cursor: pointer; transition: .15s; text-align: center; }
.btn-primary { background: var(--ac); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: var(--bg); color: var(--tx2); border: 1.5px solid var(--brd); }
.btn-secondary:hover { background: var(--card); }
.btn-success { background: var(--grn); color: #fff; }
.btn-success:hover { background: #15803d; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Success screen */
.success { text-align: center; padding: 40px 20px; }
.success .big-icon { font-size: 64px; margin-bottom: 16px; }
.success h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.success p { font-size: 14px; color: var(--tx2); margin-bottom: 24px; line-height: 1.6; }
.success .links { display: flex; flex-direction: column; gap: 8px; text-align: left; }
.success .link-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg); border-radius: 10px; font-size: 13px; color: var(--tx2); }
.success .link-row b { color: var(--tx); }

/* Hide/show */
.hidden { display: none !important; }

@media(max-width:480px) { .page { padding: 20px 16px 40px; } .form-card { padding: 20px; } }
</style>
<script src="config.js"></script>
<script src="auth-guard.js"></script>
</head>
<body>

<div class="page">
  <div class="page-hdr">
    <h1>Создание магазина</h1>
    <p>4 шага · 10 минут · всё можно изменить позже</p>
  </div>

  <div class="steps" id="steps"></div>
  <div id="wizard"></div>
</div>

<script>
// ============ STATE ============
var API = (window.API_BASE || 'https://marketplace-api-ujfh.onrender.com') + '/api/v1';

if (!AUTH.guard()) throw new Error('redirect to login');
var state = {
  step: 0, // 0-3
  name: '',
  slug: '',
  tagline: '',
  description: '',
  accent: '#1e40af',
  category: 'food',
  region: 'MSK',
  logo_letter: '',
  created: false
};

// ============ SMART DEFAULTS (задача 1.2) ============

// Транслитерация для slug
function translit(str) {
  var map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',' ':'-'};
  return str.toLowerCase().split('').map(function(c){return map[c]||c;}).join('').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'');
}

// Цвет по категории
var categoryColors = {
  food:  ['#92400e','#b45309','#d97706','#a16207','#854d0e'],
  craft: ['#9f1239','#be123c','#a21caf','#7c3aed','#6d28d9'],
  farm:  ['#166534','#15803d','#16a34a','#047857','#065f46'],
  home:  ['#1e40af','#1d4ed8','#2563eb','#0369a1','#0e7490']
};

// Описание по категории
var categoryDescriptions = {
  food:  'Свежие продукты ручной работы. Натуральные ингредиенты, крафтовое производство, доставка по городу.',
  craft: 'Авторские изделия ручной работы. Каждая вещь уникальна. Доставка по России.',
  farm:  'Фермерские продукты от производителя. Свободный выпас, без добавок. Доставка из фермы.',
  home:  'Товары для дома и быта. Качественные материалы, честные цены.'
};

// Tagline по категории
var categoryTaglines = {
  food:  'Свежее · Натуральное · Крафтовое',
  craft: 'Ручная работа · Авторские изделия',
  farm:  'От фермера · Без посредников',
  home:  'Для дома · Качество и забота'
};

function updateDefaults() {
  if (!state.slug || state.slug === translit(state._prevName || '')) {
    state.slug = translit(state.name);
  }
  state._prevName = state.name;
  state.logo_letter = state.name ? state.name[0].toUpperCase() : '?';
  if (!state.tagline) state.tagline = categoryTaglines[state.category] || '';
  if (!state.description) state.description = categoryDescriptions[state.category] || '';
  if (!state._colorManual) {
    var colors = categoryColors[state.category] || categoryColors.food;
    state.accent = colors[0];
  }
}

// ============ RENDER ============

function render() {
  // Steps
  var stepsHtml = '';
  for (var i = 0; i < 4; i++) {
    var cls = i < state.step ? 'done' : (i === state.step ? 'active' : '');
    stepsHtml += '<div class="step-dot ' + cls + '"></div>';
  }
  document.getElementById('steps').innerHTML = stepsHtml;

  // Content
  var el = document.getElementById('wizard');
  if (state.created) { renderSuccess(el); return; }

  switch(state.step) {
    case 0: renderStep0(el); break;
    case 1: renderStep1(el); break;
    case 2: renderStep2(el); break;
    case 3: renderStep3(el); break;
  }
}

// ──── Шаг 1: Название и категория ────
function renderStep0(el) {
  el.innerHTML = `
    <div class="form-card">
      <h2>Ваш магазин</h2>
      <div class="sub">Введите название — всё остальное подставим автоматически</div>

      <div class="field">
        <label>Название магазина</label>
        <input type="text" id="f-name" value="${esc(state.name)}" placeholder="Масса Матере" autofocus />
        <div class="hint">Из ИНН подставляется автоматически. Можно изменить.</div>
      </div>

      <div class="field">
        <label>Категория</label>
        <select id="f-cat">
          <option value="food" ${state.category==='food'?'selected':''}>🍞 Продукты питания</option>
          <option value="craft" ${state.category==='craft'?'selected':''}>🎨 Крафт и handmade</option>
          <option value="farm" ${state.category==='farm'?'selected':''}>🌾 Фермерские товары</option>
          <option value="home" ${state.category==='home'?'selected':''}>🏠 Товары для дома</option>
        </select>
      </div>

      <div class="field">
        <label>Регион</label>
        <select id="f-region">
          <option value="MSK" ${state.region==='MSK'?'selected':''}>Москва и МО</option>
          <option value="SPB" ${state.region==='SPB'?'selected':''}>Санкт-Петербург</option>
          <option value="KRD" ${state.region==='KRD'?'selected':''}>Краснодарский край</option>
        </select>
      </div>

      <div class="btns">
        <button class="btn btn-primary" onclick="goStep1()">Далее →</button>
      </div>
    </div>
  `;

  document.getElementById('f-name').addEventListener('input', function(e) {
    state.name = e.target.value;
    updateDefaults();
  });
  document.getElementById('f-cat').addEventListener('change', function(e) {
    state.category = e.target.value;
    state.tagline = '';
    state.description = '';
    state._colorManual = false;
    updateDefaults();
  });
  document.getElementById('f-region').addEventListener('change', function(e) {
    state.region = e.target.value;
  });
}

function goStep1() {
  if (!state.name.trim()) {
    alert('Введите название магазина');
    return;
  }
  updateDefaults();
  state.step = 1;
  render();
}

// ──── Шаг 2: Бренд (smart defaults) ────
function renderStep1(el) {
  updateDefaults();
  var colors = categoryColors[state.category] || categoryColors.food;

  el.innerHTML = `
    <div class="form-card">
      <h2>Бренд магазина</h2>
      <div class="sub">Всё заполнено автоматически — проверьте и исправьте если нужно</div>

      <div class="field">
        <label>URL магазина <span class="auto-badge">авто</span></label>
        <input type="text" id="f-slug" value="${esc(state.slug)}" />
        <div class="url-preview">нсвр.рф/shop/<b id="slug-preview">${esc(state.slug)}</b></div>
      </div>

      <div class="field">
        <label>Слоган <span class="auto-badge">авто</span></label>
        <input type="text" id="f-tagline" value="${esc(state.tagline)}" />
      </div>

      <div class="field">
        <label>Описание <span class="auto-badge">авто</span></label>
        <textarea id="f-desc">${esc(state.description)}</textarea>
        <div class="hint">AI-генерация по категории. Отредактируйте под свой магазин.</div>
      </div>

      <div class="field">
        <label>Цвет бренда <span class="auto-badge">авто</span></label>
        <div class="colors" id="color-picker">
          ${colors.map(function(c) {
            return '<div class="color-opt' + (state.accent===c?' on':'') + '" style="background:' + c + '" data-color="' + c + '"></div>';
          }).join('')}
        </div>
      </div>

      <div class="field">
        <label>Логотип <span class="auto-badge">placeholder</span></label>
        <div class="logo-preview" style="background:${state.accent}" id="logo-prev">${state.logo_letter}</div>
        <div class="hint">Автоматический placeholder. Загрузите свой логотип в личном кабинете после создания.</div>
      </div>

      <div class="btns">
        <button class="btn btn-secondary" onclick="state.step=0;render()">← Назад</button>
        <button class="btn btn-primary" onclick="goStep2()">Далее →</button>
      </div>
    </div>
  `;

  document.getElementById('f-slug').addEventListener('input', function(e) {
    state.slug = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,'');
    document.getElementById('slug-preview').textContent = state.slug;
  });
  document.getElementById('f-tagline').addEventListener('input', function(e) { state.tagline = e.target.value; });
  document.getElementById('f-desc').addEventListener('input', function(e) { state.description = e.target.value; });

  document.querySelectorAll('.color-opt').forEach(function(el) {
    el.addEventListener('click', function() {
      state.accent = this.dataset.color;
      state._colorManual = true;
      document.querySelectorAll('.color-opt').forEach(function(o){o.classList.remove('on');});
      this.classList.add('on');
      document.getElementById('logo-prev').style.background = state.accent;
    });
  });
}

function goStep2() {
  if (!state.slug.trim()) { alert('Введите URL магазина'); return; }
  state.step = 2;
  render();
}

// ──── Шаг 3: Каналы ────
function renderStep2(el) {
  el.innerHTML = `
    <div class="form-card">
      <h2>Каналы продаж</h2>
      <div class="sub">Telegram-бот и сайт создаются автоматически. Остальные — позже.</div>

      <div class="channels">
        <div class="ch-row auto">
          <div class="ch-icon">📱</div>
          <div class="ch-info">
            <div class="ch-name">Telegram-бот</div>
            <div class="ch-desc">@${state.slug}_shop_bot · Mini App витрина</div>
          </div>
          <div class="ch-badge">автоматически</div>
        </div>

        <div class="ch-row auto">
          <div class="ch-icon">🌐</div>
          <div class="ch-info">
            <div class="ch-name">Сайт</div>
            <div class="ch-desc">нсвр.рф/shop/${esc(state.slug)}</div>
          </div>
          <div class="ch-badge">автоматически</div>
        </div>

        <div class="ch-row later">
          <div class="ch-icon">💬</div>
          <div class="ch-info">
            <div class="ch-name">VK</div>
            <div class="ch-desc">Mini App в сообществе</div>
          </div>
          <div class="ch-badge">подключить позже</div>
        </div>

        <div class="ch-row later">
          <div class="ch-icon">📧</div>
          <div class="ch-info">
            <div class="ch-name">Макс</div>
            <div class="ch-desc">Бот в мессенджере</div>
          </div>
          <div class="ch-badge">подключить позже</div>
        </div>

        <div class="ch-row later">
          <div class="ch-icon">📷</div>
          <div class="ch-info">
            <div class="ch-name">Instagram</div>
            <div class="ch-desc">Shopping tags</div>
          </div>
          <div class="ch-badge">подключить позже</div>
        </div>
      </div>

      <div class="btns">
        <button class="btn btn-secondary" onclick="state.step=1;render()">← Назад</button>
        <button class="btn btn-primary" onclick="goStep3()">Далее →</button>
      </div>
    </div>
  `;
}

function goStep3() {
  state.step = 3;
  render();
}

// ──── Шаг 4: Подтверждение ────
function renderStep3(el) {
  el.innerHTML = `
    <div class="form-card">
      <h2>Всё готово — проверьте</h2>
      <div class="sub">Нажмите «Создать» — магазин заработает мгновенно</div>

      <div class="preview-shop">
        <div class="preview-cover" style="background:linear-gradient(135deg, ${state.accent}88, ${state.accent})"></div>
        <div class="preview-body">
          <div class="preview-avatar" style="background:${state.accent}">${state.logo_letter}</div>
          <div class="preview-text">
            <h3>${esc(state.name)}</h3>
            <p>${esc(state.tagline)}</p>
          </div>
        </div>
      </div>

      <div style="margin-top:16px; font-size:13px; color:var(--tx2); line-height:1.7;">
        <div><b>URL:</b> нсвр.рф/shop/${esc(state.slug)}</div>
        <div><b>Категория:</b> ${{food:'Продукты',craft:'Крафт',farm:'Фермерское',home:'Для дома'}[state.category]}</div>
        <div><b>Регион:</b> ${{MSK:'Москва и МО',SPB:'Санкт-Петербург',KRD:'Краснодарский край'}[state.region]}</div>
        <div><b>Каналы:</b> Telegram ✓ Сайт ✓</div>
        <div style="margin-top:8px; font-size:12px; color:var(--tx3);">После создания: добавьте товары → откройте магазин для покупателей</div>
      </div>

      <div class="btns">
        <button class="btn btn-secondary" onclick="state.step=2;render()">← Назад</button>
        <button class="btn btn-success" id="btn-create" onclick="createShop()">Создать магазин →</button>
      </div>
    </div>
  `;
}

// ──── Создание магазина (вызов API) ────
async function createShop() {
  var btn = document.getElementById('btn-create');
  btn.disabled = true;
  btn.textContent = 'Создаём...';

  var payload = {
    seller_id: state.seller_id || 'PTR-12345',  // из /join или default (Масса Матере)
    slug: state.slug,
    brand_name: state.name,
    brand_tagline: state.tagline,
    brand_accent: state.accent,
    brand_description: state.description,
    category: state.category,
    region: state.region,
    channels: { telegram: true, website: true, vk: false, max: false, instagram: false }
  };

  try {
    var res = await AUTH.fetch(API + '/shops', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка создания');

    console.log('Shop created:', data);
    state.shop_id = data.shop_id;
    state.created = true;
    render();
  } catch(err) {
    alert('Ошибка: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Создать магазин →';
  }
}

// ──── Финальный экран ────
function renderSuccess(el) {
  el.innerHTML = `
    <div class="form-card success">
      <div class="big-icon">🎉</div>
      <h2>${esc(state.name)}</h2>
      <p>Магазин создан! Telegram-бот и сайт готовы.<br>Теперь добавьте товары — и открывайте для покупателей.</p>

      <div class="links">
        <div class="link-row">
          <span>🌐</span>
          <div><b>Сайт:</b> нсвр.рф/shop/${esc(state.slug)}</div>
        </div>
        <div class="link-row">
          <span>📱</span>
          <div><b>Telegram:</b> @${esc(state.slug)}_shop_bot</div>
        </div>
        <div class="link-row">
          <span>🎨</span>
          <div><b>Цвет:</b> <span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:${state.accent};vertical-align:-2px"></span> ${state.accent}</div>
        </div>
      </div>

      <div class="btns" style="margin-top:24px">
        <button class="btn btn-primary" onclick="window.location.href='sku-crud.html?seller_id='+(state.seller_id||'PTR-12345')">Добавить товары →</button>
      </div>

      <div style="margin-top:16px;font-size:11px;color:var(--tx3)">
        Логотип, описание, VK, Instagram — можно настроить в личном кабинете
      </div>
    </div>
  `;
}

// ============ UTILS ============
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============ INIT ============
// Read pre-fill params from /join redirect
var urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('seller_id')) state.seller_id = urlParams.get('seller_id');
if (urlParams.get('name')) { state.name = urlParams.get('name'); updateDefaults(); }
if (urlParams.get('group')) state.seller_group = parseInt(urlParams.get('group'));

render();
</script>
