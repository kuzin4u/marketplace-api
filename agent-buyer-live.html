<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Агент покупателя · Хлеб</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#faf9f7;--card:#fff;--tx:#1a1a1a;--tx2:#555;--tx3:#999;--agent:#5b21b6;--agent-l:#f3f0ff;--buyer:#0e7490;--buyer-l:#ecfeff;--grn:#16a34a;--grn-l:#dcfce7;--brd:#e8e5e0;--sans:'Inter',-apple-system,sans-serif;--mono:'SF Mono','JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}

/* Layout */
.shell{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
.hdr{padding:16px 20px;border-bottom:1px solid var(--brd);background:var(--card);display:flex;align-items:center;gap:12px}
.hdr-avatar{width:40px;height:40px;border-radius:12px;background:var(--agent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr-info .hdr-name{font-size:15px;font-weight:700}
.hdr-info .hdr-status{font-size:11px;color:var(--tx3)}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}

.msg{display:flex;gap:8px;max-width:88%}
.msg.buyer{align-self:flex-end;flex-direction:row-reverse}
.msg .ava{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.msg.agent .ava{background:var(--agent-l);color:var(--agent)}
.msg.buyer .ava{background:var(--buyer-l);color:var(--buyer)}

.bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word}
.msg.agent .bubble{background:var(--card);border:1px solid var(--brd);border-bottom-left-radius:4px}
.msg.buyer .bubble{background:var(--buyer);color:#fff;border-bottom-right-radius:4px}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:10px 14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--tx3);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* Product cards rendered by AI */
.bubble table{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0}
.bubble th{padding:4px 6px;text-align:left;font-weight:600;font-size:10px;color:var(--tx3);border-bottom:1px solid var(--brd)}
.bubble td{padding:4px 6px;border-bottom:1px solid var(--brd);color:var(--tx2)}
.bubble b{font-weight:600}
.bubble ul,.bubble ol{padding-left:18px;margin:6px 0}
.bubble li{margin-bottom:4px}
.bubble code{font-family:var(--mono);font-size:11px;background:var(--bg);padding:1px 4px;border-radius:3px}

/* Input */
.input-bar{padding:12px 16px;border-top:1px solid var(--brd);background:var(--card);display:flex;gap:8px}
.input-bar input{flex:1;padding:11px 14px;border:1.5px solid var(--brd);border-radius:12px;font:400 14px/1 var(--sans);outline:none;background:var(--bg)}
.input-bar input:focus{border-color:var(--agent);background:var(--card)}
.input-bar button{width:44px;height:44px;border-radius:12px;border:none;background:var(--agent);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.input-bar button:hover{background:#4c1d95}
.input-bar button:disabled{opacity:.4;cursor:not-allowed}

/* Quick actions */
.quick{padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:7px 12px;border-radius:8px;border:1px solid var(--brd);background:var(--card);font:500 12px/1 var(--sans);color:var(--tx2);cursor:pointer;transition:.15s}
.quick button:hover{border-color:var(--agent);color:var(--agent)}

/* Debug toggle */
.debug-toggle{position:fixed;bottom:80px;right:12px;padding:6px 10px;border-radius:6px;background:var(--tx);color:#fff;font:600 10px/1 var(--sans);cursor:pointer;opacity:.3;z-index:10}
.debug-toggle:hover{opacity:1}
.debug-log{display:none;position:fixed;bottom:120px;right:12px;width:360px;max-height:300px;overflow-y:auto;background:#0f172a;color:#e2e8f0;font:11px/1.5 var(--mono);padding:12px;border-radius:10px;z-index:10}
.debug-log.on{display:block}
.debug-log .req{color:#60a5fa}.debug-log .res{color:#4ade80}.debug-log .err{color:#f87171}
</style>
</head>
<body>

<div class="shell">
  <div class="hdr">
    <div class="hdr-avatar">🤖</div>
    <div class="hdr-info">
      <div class="hdr-name">Хлебный ассистент</div>
      <div class="hdr-status" id="status">Агент покупателя · нейтральный</div>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="msg agent">
      <div class="ava">🤖</div>
      <div class="bubble">Привет! Я помогу найти лучший хлеб на закваске — сравню все пекарни по цене, качеству и доставке. Что ищете?</div>
    </div>
  </div>

  <div class="quick" id="quick">
    <button onclick="send('Хочу хлеб на закваске, лучшее цена/качество')">🍞 Лучший по цена/качество</button>
    <button onclick="send('Что есть до 400 рублей?')">💰 До 400₽</button>
    <button onclick="send('Сравни все пекарни')">📊 Сравнить всех</button>
  </div>

  <div class="input-bar">
    <input type="text" id="input" placeholder="Спросите про хлеб..." />
    <button id="send-btn" onclick="sendFromInput()">→</button>
  </div>
</div>

<div class="debug-toggle" onclick="toggleDebug()">API</div>
<div class="debug-log" id="debug"></div>

<script>
// ============ CONFIG ============
var CATALOG_API = 'https://marketplace-api-ujfh.onrender.com/api/v1';
var CLAUDE_API = 'https://api.anthropic.com/v1/messages';
var MODEL = 'claude-sonnet-4-6';

var chatHistory = []; // conversation history for Claude
var catalogData = null; // cached catalog

// ============ INIT: Load catalog ============
async function loadCatalog() {
  debugLog('req', '→ GET ' + CATALOG_API + '/catalog/search?limit=50');
  try {
    var res = await fetch(CATALOG_API + '/catalog/search?limit=50');
    var data = await res.json();
    catalogData = data.products;
    debugLog('res', '← ' + catalogData.length + ' products loaded');
    document.getElementById('status').textContent = 'Агент покупателя · ' + catalogData.length + ' товаров в каталоге';
  } catch(err) {
    debugLog('err', 'Catalog load failed: ' + err.message);
    catalogData = [];
  }
}
loadCatalog();

// ============ SYSTEM PROMPT ============
function buildSystemPrompt() {
  var productsText = (catalogData || []).map(function(p) {
    return [
      p.title,
      'Пекарня: ' + p.brand_name,
      'Цена: ' + p.price + '₽',
      'Вес: ' + (p.weight_g || '?') + 'г',
      'Цена/кг: ' + (p.weight_g ? Math.round(parseFloat(p.price) / p.weight_g * 1000) + '₽' : '?'),
      'Рейтинг: ' + p.rating + ' (' + p.reviews_count + ' отзывов)',
      'Заказов: ' + p.orders_count,
      'Категория: ' + (p.category_name || ''),
      'В наличии: ' + p.stock + ' шт',
      'Описание: ' + (p.description || '').substring(0, 100)
    ].join(' | ');
  }).join('\n');

  return `Ты — агент покупателя хлеба на закваске. Твоя задача — помочь покупателю найти лучший хлеб среди всех пекарен в каталоге.

ПРАВИЛА:
1. Ты работаешь НА ПОКУПАТЕЛЯ, не на селлера. Ты нейтрален — не продвигаешь конкретную пекарню.
2. При сравнении используй объективные метрики: цена за кг, рейтинг, число заказов, отзывы.
3. Показатель цена/качество = цена_за_кг ÷ рейтинг. Чем ниже — тем лучше.
4. Всегда показывай расчёт — почему рекомендуешь именно этот товар.
5. Если покупатель спрашивает про конкретную пекарню — отвечай, но упомяни альтернативы.
6. Если товара нет в каталоге — честно скажи.
7. Отвечай кратко, по делу. Не более 3-4 абзацев.
8. Используй простые таблицы (markdown) для сравнений.
9. Отвечай на русском языке.

КАТАЛОГ СИСТЕМЫ (все доступные товары):
${productsText || 'Каталог загружается...'}

Если каталог пуст или загружается — попроси подождать и попробовать снова.`;
}

// ============ SEND MESSAGE ============
function sendFromInput() {
  var input = document.getElementById('input');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
}

document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendFromInput();
});

async function send(text) {
  // Hide quick actions after first message
  document.getElementById('quick').style.display = 'none';

  // Add buyer message
  addMessage('buyer', text);
  
  // Add to history
  chatHistory.push({ role: 'user', content: text });

  // Show typing
  var typingEl = addTyping();
  document.getElementById('send-btn').disabled = true;

  try {
    // Call Claude API
    var response = await callClaude(chatHistory);
    
    // Remove typing
    typingEl.remove();
    
    // Add agent response
    addMessage('agent', response);
    chatHistory.push({ role: 'assistant', content: response });

  } catch(err) {
    typingEl.remove();
    addMessage('agent', 'Ошибка: ' + err.message + '. Попробуйте ещё раз.');
    debugLog('err', err.message);
  }

  document.getElementById('send-btn').disabled = false;
}

// ============ CLAUDE API ============
async function callClaude(messages) {
  var body = {
    model: MODEL,
    max_tokens: 1000,
    system: buildSystemPrompt(),
    messages: messages
  };

  debugLog('req', '→ POST Claude API (' + messages.length + ' messages)');

  try {
    var res = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });

    var data = await res.json();

    if (!res.ok) {
      debugLog('err', 'Claude error: ' + JSON.stringify(data).substring(0, 200));
      throw new Error(data.error?.message || 'API error ' + res.status);
    }

    var text = data.content.map(function(c) { return c.text || ''; }).join('');
    debugLog('res', '← ' + text.substring(0, 100) + '...');
    return text;
  } catch(err) {
    debugLog('err', 'Fetch error: ' + err.message);
    
    // Fallback: generate response locally from catalog data
    debugLog('req', '→ Fallback: local response from catalog');
    return generateLocalResponse(messages[messages.length - 1].content);
  }
}

// ============ LOCAL FALLBACK (when Claude API unavailable) ============
function generateLocalResponse(query) {
  if (!catalogData || catalogData.length === 0) {
    return 'Каталог пуст. Попробуйте позже.';
  }

  var q = query.toLowerCase();
  var products = catalogData.map(function(p) {
    var pricePerKg = p.weight_g ? Math.round(parseFloat(p.price) / p.weight_g * 1000) : null;
    var priceQuality = pricePerKg && parseFloat(p.rating) > 0 ? Math.round(pricePerKg / parseFloat(p.rating)) : null;
    return {
      title: p.title,
      seller: p.brand_name,
      price: parseFloat(p.price),
      weight: p.weight_g,
      pricePerKg: pricePerKg,
      rating: parseFloat(p.rating),
      reviews: p.reviews_count,
      orders: p.orders_count,
      priceQuality: priceQuality,
      description: p.description
    };
  });

  // Sort by price/quality ratio
  products.sort(function(a, b) { return (a.priceQuality || 9999) - (b.priceQuality || 9999); });

  var response = '**Каталог: ' + products.length + ' товаров**\n\n';
  
  if (q.includes('цена') || q.includes('качество') || q.includes('лучш') || q.includes('сравни')) {
    response += 'Ранжирование по цена/качество (₽/кг ÷ рейтинг, чем ниже — тем лучше):\n\n';
    response += '| Товар | Пекарня | Цена | Вес | ₽/кг | ⭐ | Цена/кач. |\n';
    response += '|---|---|---|---|---|---|---|\n';
    products.forEach(function(p, i) {
      var badge = i === 0 ? ' 🏆' : '';
      response += '| ' + p.title + badge + ' | ' + p.seller + ' | ' + p.price + '₽ | ' + (p.weight || '?') + 'г | ' + (p.pricePerKg || '?') + ' | ' + p.rating + ' | ' + (p.priceQuality || '?') + ' |\n';
    });
    response += '\n**Лучший выбор:** ' + products[0].title + ' (' + products[0].seller + ') — ' + products[0].price + '₽ за ' + products[0].weight + 'г, рейтинг ' + products[0].rating + '.';
  } else if (q.includes('400') || q.includes('дешев') || q.includes('недорог')) {
    var cheap = products.filter(function(p){ return p.price <= 400; });
    if (cheap.length === 0) {
      response += 'Товаров до 400₽ нет. Самый доступный: **' + products[products.length-1].title + '** за ' + products[products.length-1].price + '₽.';
    } else {
      response += 'До 400₽:\n\n';
      cheap.forEach(function(p) {
        response += '- **' + p.title + '** (' + p.seller + ') — ' + p.price + '₽, ' + p.weight + 'г, ⭐' + p.rating + '\n';
      });
    }
  } else {
    response += 'Доступные товары:\n\n';
    products.forEach(function(p) {
      response += '- **' + p.title + '** (' + p.seller + ') — ' + p.price + '₽, ' + (p.weight || '?') + 'г, ⭐' + p.rating + ' (' + p.reviews + ' отзывов, ' + p.orders + ' заказов)\n';
    });
    response += '\nСпросите: «лучшее цена/качество», «до 400₽», «сравни по рейтингу» — отвечу с расчётом.';
  }

  debugLog('res', '← Local response: ' + response.substring(0, 80) + '...');
  return response;
}

// ============ UI ============
function addMessage(type, text) {
  var msgs = document.getElementById('msgs');
  var div = document.createElement('div');
  div.className = 'msg ' + type;
  
  var rendered = text;
  if (type === 'agent') {
    // Convert markdown-like formatting
    rendered = rendered
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\n\n/g, '<br><br>')
      .replace(/\n/g, '<br>')
      // Simple markdown table support
      .replace(/\|(.+)\|/g, function(match) {
        return match; // keep tables as-is, CSS handles
      });

    // Convert markdown tables to HTML
    if (rendered.includes('|')) {
      var lines = text.split('\n');
      var inTable = false;
      var tableHtml = '';
      var otherHtml = '';
      var isHeader = true;
      
      lines.forEach(function(line) {
        if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
          if (!inTable) { 
            tableHtml += '<table>'; 
            inTable = true; 
            isHeader = true;
          }
          // Skip separator rows
          if (line.includes('---')) return;
          
          var cells = line.split('|').filter(function(c){return c.trim();});
          var tag = isHeader ? 'th' : 'td';
          tableHtml += '<tr>' + cells.map(function(c){return '<'+tag+'>'+c.trim()+'</'+tag+'>';}).join('') + '</tr>';
          isHeader = false;
        } else {
          if (inTable) { tableHtml += '</table>'; inTable = false; }
          otherHtml += line + '\n';
        }
      });
      if (inTable) tableHtml += '</table>';
      
      rendered = (otherHtml.trim().replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>') + tableHtml)
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    }
  }

  div.innerHTML = '<div class="ava">' + (type === 'agent' ? '🤖' : '👤') + '</div>' +
                  '<div class="bubble">' + (type === 'buyer' ? escHtml(text) : rendered) + '</div>';
  
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTyping() {
  var msgs = document.getElementById('msgs');
  var div = document.createElement('div');
  div.className = 'msg agent';
  div.innerHTML = '<div class="ava">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ DEBUG ============
function debugLog(type, text) {
  var el = document.getElementById('debug');
  el.innerHTML += '<div class="' + type + '">' + escHtml(text) + '</div>';
  el.scrollTop = el.scrollHeight;
}

function toggleDebug() {
  document.getElementById('debug').classList.toggle('on');
}
</script>
</body>
</html>
